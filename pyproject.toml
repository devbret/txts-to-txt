[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "txts-to-txt"
version = "1.0.0"
description = "Combine all .txt files in a directory into a single output file with per-file separators."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bret Bernhoft" }]

[project.urls]
Homepage = "https://github.com/devbret/txts-to-txt"

[project.scripts]
txts-to-txt = "app:main"

[tool.setuptools]
py-modules = ["app"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "G", "SIM", "RUF"]
